name: Directory copy edit
on:
  push:
    branches: [chore/directory-recognition-20261004]
    paths: [.github/workflows/directory-copy-edit.yml]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved investor copy
        run: |
          set -eu
          git worktree add --detach ../directory-copy HEAD
          cd ../directory-copy
          python3 -u - <<'PY'
          from pathlib import Path
          p=Path('index.html'); text=p.read_text()
          copy='Best Overall + Best API Option — AI Agents Directory, 52+ music tools'
          old='<li>Suede AI was ranked the <strong>#1 Overall Music Platform</strong> by AI Agents Directory.</li>'
          assert text.count(old)==1
          new='<li><a href="https://aiagentsdirectory.com/category/music" target="_blank" rel="noopener">'+copy+'</a></li>'
          updated=text.replace(old,new)
          assert updated.count(copy)==1 and updated.replace(new,old)==text
          p.write_text(updated)
          print('PASS: single investor recognition line changed; source link preserved')
          PY
          git diff --check
          git diff --stat
          git config user.name 'Jason Colapietro'
          git config user.email '55137770+JasonColapietro@users.noreply.github.com'
          git add index.html
          git commit -m 'Use approved AI Agents Directory wording in investor deck'
          git push origin HEAD:chore/directory-recognition-20261004
